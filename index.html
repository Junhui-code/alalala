<!DOCTYPE html>

<style>

.statl{font-size:.56em;text-align:left;opacity:.9}

.hint{font-size:.6em;opacity:.75;margin-top:.5em;line-height:1.6}
.keys{font-size:.7em;text-align:left;line-height:1.75;display:grid;grid-template-columns:auto auto auto;gap:0 1.2em}
.keys b{color:#ffd23a}
kbd{display:inline-block;padding:0 .35em;border:1px solid rgba(255,255,255,.55);border-radius:.25em;background:rgba(255,255,255,.14);font-family:inherit;font-size:.9em;line-height:1.4}
.big{font-size:1.7em;font-weight:900}
.loading{font-size:1.4em;font-weight:900;text-shadow:.08em .08em 0 #000;animation:bob 1s ease-in-out infinite}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="384" height="216"></canvas>
<canvas id="hud"></canvas>
<div id="ui"></div>
</div>
<script>
'use strict';
// =====================================================================
//  超级像素赛车 / SUPER PIXEL KART
//  SNES 风格 Mode 7 伪 3D 卡丁车。所有图像与声音均由代码程序化生成。
// =====================================================================

// ---------------------------------------------------------------- utils
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU; return d; }
function mkRng(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rgb(c, k = 1) { return `rgb(${clamp(c[0] * k | 0, 0, 255)},${clamp(c[1] * k | 0, 0, 255)},${clamp(c[2] * k | 0, 0, 255)})`; }
function fmtTime(t) {
  if (t == null || !isFinite(t)) return `-'--"--`;
  const m = Math.floor(t / 60), s = Math.floor(t % 60), c = Math.floor((t * 100) % 100);
  return `${m}'${String(s).padStart(2, '0')}"${String(c).padStart(2, '0')}`;
}
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
function load(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function roundRect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

// ------------------------------------------------------------ constants
const RW = 384, RH = 216;         // 内部渲染分辨率 (16:9)
const TS = 2048;                  // 赛道贴图尺寸 (1 texel = 1 世界单位)
const S_ROAD = 0, S_OFF = 1, S_WALL = 2, S_DEEP = 3;
const NA = 24;                    // 精灵角度帧数
const LAPS = 3;
const STEP = 1 / 60;
const CC_TABLE = { 50: { speed: 118, ai: 0.9 }, 100: { speed: 138, ai: 0.95 }, 150: { speed: 158, ai: 0.985 } };
const POINTS = [10, 8, 6, 5, 4, 3, 2, 1];

// ---------------------------------------------------------------- input
const KEYS = new Set();
const PREVENT = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Slash', 'Tab', 'Backspace', 'Quote']);
const BIND = {
  solo: { left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'], accel: ['ArrowUp', 'KeyW'], brake: ['ArrowDown', 'KeyS'], drift: ['Space', 'ShiftLeft', 'ShiftRight', 'KeyC'], item: ['KeyX', 'KeyE', 'KeyZ'] },
  p1: { left: ['KeyA'], right: ['KeyD'], accel: ['KeyW'], brake: ['KeyS'], drift: ['KeyF', 'ShiftLeft', 'Space'], item: ['KeyG', 'KeyQ', 'KeyE'] },
  p2: { left: ['ArrowLeft'], right: ['ArrowRight'], accel: ['ArrowUp'], brake: ['ArrowDown'], drift: ['Slash', 'ShiftRight', 'KeyL', 'Numpad0'], item: ['Period', 'KeyK', 'NumpadDecimal', 'Enter'] },
};
const MENU_MAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Enter: 'ok', NumpadEnter: 'ok', Space: 'ok', KeyZ: 'ok', Escape: 'back', Backspace: 'back', KeyX: 'back' };
const anyKey = list => list.some(c => KEYS.has(c));
function getPads() {
  const out = [];
  if (!navigator.getGamepads) return out;
  for (const p of navigator.getGamepads()) if (p && p.connected) out.push(p);
  return out;
}
function readInput(pi, twoP) {
  const b = twoP ? (pi === 0 ? BIND.p1 : BIND.p2) : BIND.solo;
  let steer = (anyKey(b.right) ? 1 : 0) - (anyKey(b.left) ? 1 : 0);
  let accel = anyKey(b.accel), brake = anyKey(b.brake), drift = anyKey(b.drift), item = anyKey(b.item);
  const gp = getPads()[pi];
  if (gp) {
    const bt = i => gp.buttons[i] && gp.buttons[i].pressed;
    const ax = gp.axes[0] || 0;
    if (Math.abs(ax) > 0.2) steer = clamp(steer + (ax - Math.sign(ax) * 0.2) / 0.8, -1, 1);
    if (bt(14)) steer = -1; if (bt(15)) steer = 1;
    if (bt(0)) accel = true; if (bt(1)) brake = true;
    if (bt(5) || bt(7)) drift = true;
    if (bt(2) || bt(4) || bt(6)) item = true;
  }
  return { steer, accel, brake, drift, item };
}

// ---------------------------------------------------------------- audio
const SND = {
  ctx: null, master: null, sfxG: null, musG: null, noise: null, muted: load('spk_muted', false),
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { return; }
    const c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : 0.7; this.master.connect(c.destination);
    this.sfxG = c.createGain(); this.sfxG.gain.value = 0.9; this.sfxG.connect(this.master);
    this.musG = c.createGain(); this.musG.gain.value = 0.3; this.musG.connect(this.master);
    const len = c.sampleRate, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = b;
    if (MUSIC.want) MUSIC.play(MUSIC.want);
  },
  toggleMute() {
    this.muted = !this.muted; store('spk_muted', this.muted);
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.7;
  },
  tone(f, dur, o = {}) {
    const c = this.ctx; if (!c) return;
    const t = o.at != null ? o.at : c.currentTime + (o.delay || 0);
    const os = c.createOscillator(); os.type = o.type || 'square';
    os.frequency.setValueAtTime(f, t);
    if (o.to) os.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t + dur);
    const g = c.createGain(), v = o.vol != null ? o.vol : 0.2;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    os.connect(g); g.connect(o.dest || this.sfxG); os.start(t); os.stop(t + dur + 0.03);
  },
  nz(dur, o = {}) {
    const c = this.ctx; if (!c) return;
    const t = o.at != null ? o.at : c.currentTime + (o.delay || 0);
    const s = c.createBufferSource(); s.buffer = this.noise; s.loop = true;
    const fl = c.createBiquadFilter(); fl.type = o.ft || 'bandpass';
    fl.frequency.setValueAtTime(o.f || 1500, t);
    if (o.to) fl.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    fl.Q.value = o.q != null ? o.q : 1;
    const g = c.createGain(); g.gain.setValueAtTime(o.vol != null ? o.vol : 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(o.dest || this.sfxG);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
  },
  makeEngine() {
    const c = this.ctx; if (!c) return null;
    const o1 = c.createOscillator(); o1.type = 'sawtooth';
    const o2 = c.createOscillator(); o2.type = 'square';
    const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 700;
    const g = c.createGain(); g.gain.value = 0;
    o1.connect(fl); o2.connect(fl); fl.connect(g); g.connect(this.sfxG);
    const n = c.createBufferSource(); n.buffer = this.noise; n.loop = true;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2600; bp.Q.value = 5;
    const ng = c.createGain(); ng.gain.value = 0;
    n.connect(bp); bp.connect(ng); ng.connect(this.sfxG);
    o1.start(); o2.start(); n.start();
    return {
      update(ratio, drifting, boost, vol) {
        const t = c.currentTime, base = 50 + ratio * 150 + (boost ? 40 : 0);
        o1.frequency.setTargetAtTime(base, t, 0.06);
        o2.frequency.setTargetAtTime(base * 1.5, t, 0.06);
        fl.frequency.setTargetAtTime(500 + ratio * 900, t, 0.1);
        g.gain.setTargetAtTime(vol * (0.035 + 0.045 * ratio), t, 0.08);
        ng.gain.setTargetAtTime(drifting ? 0.045 * vol : 0, t, 0.05);
      },
      stop() { try { o1.stop(); o2.stop(); n.stop(); } catch (e) { } g.disconnect(); ng.disconnect(); }
    };
  }
};
const midi = m => 440 * Math.pow(2, (m - 69) / 12);
function arp(notes, len, o = {}) { notes.forEach((m, i) => SND.tone(midi(m), len * 1.6, { ...o, delay: (o.delay || 0) + i * len })); }
function sfx(name, vol = 1) {
  if (!SND.ctx) return;
  const T = SND.tone.bind(SND), Nz = SND.nz.bind(SND), v = vol;
  switch (name) {
    case 'move': T(660, 0.05, { vol: 0.1 * v }); break;
    case 'select': T(880, 0.06, { vol: 0.12 * v }); T(1320, 0.1, { vol: 0.12 * v, delay: 0.05 }); break;
    case 'back': T(440, 0.08, { vol: 0.12 * v, to: 300 }); break;
    case 'count': T(midi(69), 0.3, { vol: 0.22 * v }); break;
    case 'go': T(midi(81), 0.7, { vol: 0.22 * v }); break;
    case 'box': T(700, 0.06, { vol: 0.12 * v, type: 'triangle', to: 1400 }); Nz(0.12, { f: 3000, vol: 0.08 * v }); break;
    case 'roul': T(1100 + Math.random() * 500, 0.03, { vol: 0.05 * v }); break;
    case 'get': T(988, 0.07, { vol: 0.14 * v }); T(1480, 0.14, { vol: 0.14 * v, delay: 0.07 }); break;
    case 'shell': Nz(0.25, { f: 700, to: 3000, vol: 0.2 * v }); T(300, 0.2, { to: 900, vol: 0.08 * v, type: 'sawtooth' }); break;
    case 'drop': T(260, 0.1, { vol: 0.12 * v, type: 'triangle', to: 180 }); break;
    case 'hit': Nz(0.35, { f: 1400, to: 200, vol: 0.3 * v, ft: 'lowpass' }); T(700, 0.4, { to: 90, vol: 0.12 * v, type: 'sawtooth' }); break;
    case 'spin': T(1000, 0.5, { to: 200, vol: 0.1 * v, type: 'triangle' }); break;
    case 'coin': T(988, 0.07, { vol: 0.12 * v }); T(1319, 0.28, { vol: 0.12 * v, delay: 0.07 }); break;
    case 'boost': Nz(0.6, { f: 400, to: 2800, vol: 0.2 * v }); T(180, 0.5, { to: 520, vol: 0.08 * v, type: 'sawtooth' }); break;
    case 'mini1': T(1600, 0.05, { vol: 0.07 * v, type: 'sine' }); break;
    case 'mini2': T(2200, 0.06, { vol: 0.08 * v, type: 'sine' }); break;
    case 'bump': T(130, 0.14, { to: 60, vol: 0.22 * v }); Nz(0.08, { f: 500, vol: 0.15 * v, ft: 'lowpass' }); break;
    case 'hop': T(330, 0.07, { to: 520, vol: 0.06 * v }); break;
    case 'fall': T(900, 0.8, { to: 120, vol: 0.14 * v, type: 'triangle' }); break;
    case 'splash': Nz(0.5, { f: 3000, to: 300, vol: 0.2 * v, ft: 'lowpass' }); break;
    case 'lap': arp([72, 76, 79, 84], 0.07, { vol: 0.12 * v }); break;
    case 'final': arp([67, 71, 74, 79, 83, 86], 0.08, { vol: 0.13 * v }); break;
    case 'finish': arp([72, 72, 72, 76, 79, 84, 79, 84], 0.11, { vol: 0.14 * v }); break;
    case 'star': arp([72, 76, 79, 84, 88, 91], 0.05, { vol: 0.1 * v, type: 'triangle' }); break;
    case 'lightning': Nz(0.8, { f: 5000, to: 100, vol: 0.35 * v, ft: 'lowpass' }); T(1600, 0.6, { to: 50, vol: 0.15 * v, type: 'sawtooth' }); break;
    case 'squish': T(220, 0.2, { to: 70, vol: 0.14 * v }); break;
    case 'respawn': arp([79, 76, 72], 0.06, { vol: 0.08 * v, type: 'triangle' }); break;
    case 'wrong': T(220, 0.15, { vol: 0.08 * v }); break;
  }
}

// ---------------------------------------------------------------- music
// 原创芯片音乐：lead 为 [MIDI 音高, 八分音符长度]，roots 为每小节贝斯根音
const SONGS = {
  menu: { bpm: 112, roots: [43, 48, 43, 50, 45, 50, 43, 43], lead: [[67, 2], [71, 2], [74, 2], [71, 2], [72, 2], [76, 2], [74, 4], [71, 1], [72, 1], [74, 2], [79, 2], [78, 2], [76, 2], [74, 2], [72, 2], [71, 2], [69, 2], [72, 2], [76, 2], [74, 2], [72, 2], [71, 2], [69, 4], [67, 1], [69, 1], [71, 2], [72, 2], [74, 2], [71, 4], [67, 4]] },
  sunny: { bpm: 150, roots: [48, 53, 48, 43, 48, 53, 43, 48], lead: [[76, 1], [79, 1], [84, 2], [83, 1], [79, 1], [76, 2], [77, 1], [81, 1], [84, 1], [81, 1], [79, 4], [76, 1], [79, 1], [84, 1], [86, 2], [84, 1], [83, 1], [81, 1], [79, 2], [76, 2], [74, 2], [0, 2], [72, 1], [76, 1], [79, 1], [84, 1], [83, 2], [79, 2], [81, 1], [79, 1], [77, 1], [76, 1], [74, 4], [77, 1], [81, 1], [84, 1], [86, 1], [88, 2], [86, 1], [84, 1], [83, 2], [86, 2], [84, 4]] },
  ghost: { bpm: 128, roots: [45, 45, 40, 45, 45, 45, 50, 40], lead: [[69, 2], [72, 1], [76, 1], [75, 2], [72, 2], [71, 1], [72, 1], [71, 1], [68, 1], [69, 4], [69, 1], [72, 1], [76, 1], [81, 1], [80, 2], [76, 2], [77, 1], [76, 1], [74, 1], [71, 1], [72, 2], [71, 2], [76, 2], [77, 1], [76, 1], [75, 2], [76, 2], [72, 1], [71, 1], [69, 1], [68, 1], [69, 4], [65, 1], [69, 1], [72, 1], [77, 1], [76, 2], [74, 2], [71, 2], [68, 2], [69, 4]] },
  castle: { bpm: 160, roots: [38, 38, 46, 45, 38, 38, 46, 45], lead: [[62, 1], [62, 1], [65, 1], [62, 1], [67, 1], [62, 1], [68, 1], [67, 1], [65, 1], [62, 1], [65, 1], [67, 1], [69, 4], [74, 1], [72, 1], [69, 1], [67, 1], [69, 1], [65, 1], [67, 1], [64, 1], [62, 2], [0, 2], [61, 2], [64, 2], [62, 1], [62, 1], [65, 1], [62, 1], [67, 1], [62, 1], [68, 1], [67, 1], [65, 1], [62, 1], [65, 1], [67, 1], [70, 4], [70, 1], [69, 1], [67, 1], [65, 1], [67, 2], [69, 2], [74, 2], [73, 2], [74, 4]] },
};
const MUSIC = {
  cur: null, want: null, step: 0, next: 0, timer: null, tempo: 1, paused: false,
  play(name) {
    this.stop(); this.want = name; this.paused = false;
    if (!SND.ctx) return;
    const s = SONGS[name]; if (!s) return;
    if (!s._lead) { s._lead = []; for (const [n, l] of s.lead) { s._lead.push([n, l]); for (let i = 1; i < l; i++) s._lead.push(null); } }
    this.cur = s; this.tempo = 1; this.step = 0; this.next = SND.ctx.currentTime + 0.1;
    this.timer = setInterval(() => this.tick(), 30);
  },
  stop() { if (this.timer) clearInterval(this.timer); this.timer = null; this.cur = null; this.want = null; },
  tick() {
    const c = SND.ctx; if (!c || !this.cur || this.paused) return;
    const spb = 60 / (this.cur.bpm * this.tempo) / 2;
    if (this.next < c.currentTime - 0.2) this.next = c.currentTime + 0.02;
    while (this.next < c.currentTime + 0.15) { this.sched(this.step, this.next, spb); this.next += spb; this.step++; }
  },
  sched(step, t, spb) {
    const s = this.cur, L = s._lead, e = L[step % L.length], D = SND.musG;
    if (e && e[0] > 0) {
      SND.tone(midi(e[0]), e[1] * spb * 0.95, { at: t, vol: 0.12, dest: D });
      SND.tone(midi(e[0]) * 1.005, e[1] * spb * 0.9, { at: t, vol: 0.04, dest: D, type: 'triangle' });
    }
    const r = s.roots[Math.floor(step / 8) % s.roots.length], pat = [0, 12, 7, 12, 0, 12, 7, 12];
    SND.tone(midi(r + pat[step % 8]), spb * 0.9, { at: t, vol: 0.2, dest: D, type: 'triangle' });
    if (step % 4 === 0) SND.tone(140, 0.12, { at: t, to: 45, vol: 0.28, dest: D, type: 'sine' });
    if (step % 8 === 4) SND.nz(0.12, { at: t, f: 1800, vol: 0.14, dest: D });
    if (step % 2 === 1) SND.nz(0.04, { at: t, f: 8000, ft: 'highpass', vol: 0.05, dest: D });
  }
};

// ----------------------------------------------------------- characters

    add(p.x, p.y, p.z, o => { const sz = Math.max(1, p.size * o.s * 0.5); ctx.globalAlpha = clamp(p.life / p.max * 1.5, 0, 1); ctx.fillStyle = p.col; ctx.fillRect(Math.round(o.sx - sz / 2), Math.round(o.sy - sz / 2), Math.ceil(sz), Math.ceil(sz)); ctx.globalAlpha = 1; });
  }
  for (const k of R.karts) {
    if (k.fall && !k.fall.placed && k.fall.t > 0.6) continue;
    // 拖在身后的道具
    if (k.itemState === 'hold' && k.item) { const ca = Math.cos(k.angle), sa = Math.sin(k.angle); add(k.x - ca * 12, k.y - sa * 12, 0, bill(SPR[k.item], 8, 8)); }
    add(k.x, k.y, Math.max(k.z, -8), o => drawKart(k, o, R), null);
    if (k.fall && k.fall.placed) add(k.x, k.y, k.z + 16, o => {
      ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(o.sx + 6 * o.s, o.sy - 18 * o.s); ctx.lineTo(o.sx + 6 * o.s, o.sy - 4 * o.s); ctx.stroke();
      bill(SPR.cloud, 20, 15)({ ...o, sy: o.sy - 4 * o.s });
    });
  }
  list.sort((a, b) => b.rz - a.rz);
  ctx.save(); ctx.beginPath(); ctx.rect(0, v.oy, RW, v.h); ctx.clip();

}
function drawKart(k, o, R) {
  if (k.invT > 0 && !k.fall && k.spinT <= 0 && Math.floor(performance.now() / 70) % 2) return;

  if (k.drift) rel += k.drift * 0.35;
  rel = ((rel % TAU) + TAU) % TAU;
  const fi = Math.round(rel / TAU * NA) % NA;
  const img = k.frames[fi];
  const W = SPR_UNITS * o.s * size, Hh = SPR_UNITS * o.s * size * hMul;
  const x = o.sx - SPR_AX / SPR_SIZE * W, y = o.sy - SPR_AY / SPR_SIZE * Hh;
  ctx.drawImage(img, Math.round(x), Math.round(y), Math.round(W), Math.round(Hh));
  if (k.starT > 0 || k.boostT > 0 && k.boostPow > 1.42) {
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = k.starT > 0 ? 0.55 + 0.35 * Math.sin(performance.now() / 50) : 0.25;
    ctx.drawImage(img, Math.round(x), Math.round(y), Math.round(W), Math.round(Hh));

}

const PLACE_COL = ['#ffd700', '#dfe8f2', '#e89a4c'];
function hudText(c, text, x, y, size, col = '#fff', align = 'left', italic = true) {
  c.font = `${italic ? 'italic ' : ''}900 ${size}px "Arial Black","PingFang SC","Microsoft YaHei",sans-serif`;
  c.textAlign = align; c.textBaseline = 'middle'; c.lineJoin = 'round';
  c.lineWidth = Math.max(2, size * 0.2); c.strokeStyle = '#000'; c.strokeText(text, x, y);
  c.fillStyle = col; c.fillText(text, x, y);
}
function drawHUD(R) {
  const W = hud.width, Hh = hud.height, c = hctx;
  c.clearRect(0, 0, W, Hh);
  if (R.mode === 'attract' || G.scene !== 'race') return;
  const u = W / RW, split = R.views.length > 1, T = R.track;
  c.imageSmoothingEnabled = false;
  for (const v of R.views) {
    const k = v.kart, Y0 = v.oy * u, VH = v.h * u, S = u * (split ? 0.6 : 1);
    // 道具栏
    const bs = 36 * S, bx = 10 * S, by = Y0 + 8 * S;
    c.fillStyle = 'rgba(0,0,0,.45)'; roundRect(c, bx, by, bs, bs, 6 * S); c.fill(); c.lineWidth = 2.5 * S; c.strokeStyle = '#fff'; c.stroke();
    let icon = null;
    if (k.itemState === 'roulette') { const n = ITEM_KEYS[Math.floor(performance.now() / 70) % ITEM_KEYS.length]; icon = n === 'coin' ? SPR.coin[0] : SPR[n]; }
    else if (k.item) icon = itemIcon(k);
    if (icon) c.drawImage(icon, bx + 4 * S, by + 4 * S, bs - 8 * S, bs - 8 * S);
    if (k.itemState === 'hold') hudText(c, '拖行中', bx + bs / 2, by + bs + 7 * S, 7 * S, '#ffd23a', 'center', false);
    // 时间
    hudText(c, fmtTime(k.finished ? k.finishTime : R.time), W - 10 * S, Y0 + 15 * S, 13 * S, '#fff', 'right');
    if (!split) k.lapTimes.forEach((t, i) => hudText(c, `${i + 1}圈  ${fmtTime(t)}`, W - 10 * S, Y0 + (31 + i * 11) * S, 8 * S, '#cfeaff', 'right', false));
    // 金币 / 圈数
    c.drawImage(SPR.coin[0], 9 * S, Y0 + VH - 45 * S, 15 * S, 15 * S);
    hudText(c, `×${k.coins}`, 26 * S, Y0 + VH - 37 * S, 12 * S, k.coins >= 10 ? '#ffd23a' : '#fff');
    hudText(c, `LAP ${clamp(k.lap, 1, R.laps)}/${R.laps}`, 10 * S, Y0 + VH - 15 * S, 14 * S, k.lap === R.laps ? '#ffd23a' : '#fff');
    // 名次
    if (R.karts.length > 1) {
      const n = k.place, suf = n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th', size = 44 * S, x = W - 10 * S, y = Y0 + VH - 8 * S;
      const font = sz => `italic 900 ${sz}px "Arial Black",sans-serif`;
      c.textBaseline = 'alphabetic'; c.textAlign = 'right'; c.lineJoin = 'round';
      c.font = font(size * 0.42); const sw = c.measureText(suf).width;
      const g = c.createLinearGradient(0, y - size * 0.8, 0, y); g.addColorStop(0, '#fff'); g.addColorStop(1, PLACE_COL[n - 1] || '#7fc8ff');
      c.lineWidth = size * 0.16; c.strokeStyle = '#000';
      c.strokeText(suf, x, y); c.fillStyle = g; c.fillText(suf, x, y);
      c.font = font(size); c.strokeText(String(n), x - sw - 2 * S, y); c.fillText(String(n), x - sw - 2 * S, y);
    }
    // 小地图 + 名次列表（单人画面）
    if (!split) {
      const ms = 80 * S, mx = W - ms - 8 * S, my = Y0 + 70 * S;
      c.globalAlpha = 0.75; c.drawImage(T.mini, mx, my, ms, ms); c.globalAlpha = 1;
      for (const o of [...R.karts].sort((a, b) => (a.human >= 0) - (b.human >= 0))) {
        const px = mx + o.x / TS * ms, py = my + o.y / TS * ms, r = (o.human >= 0 ? 3.2 : 2.2) * S;
        c.fillStyle = rgb(o.color); c.strokeStyle = o.human >= 0 ? '#fff' : '#000'; c.lineWidth = 1.2 * S;
        c.beginPath(); c.arc(px, py, r, 0, TAU); c.fill(); c.stroke();
      }
      if (R.karts.length > 1 && R.order) {
        R.order.forEach((o, i) => {
          const y = Y0 + (54 + i * 14) * S, x = 10 * S;
          hudText(c, String(i + 1), x + 4 * S, y + 6 * S, 8 * S, PLACE_COL[i] || '#fff', 'center');
          c.fillStyle = o.human >= 0 ? 'rgba(255,210,58,.9)' : 'rgba(0,0,0,.45)'; c.fillRect(x + 10 * S, y, 13 * S, 12 * S);
          c.drawImage(o.frames[NA / 2], 18, 4, 28, 26, x + 10.5 * S, y + 0.5 * S, 12 * S, 11 * S);
        });
      }
    }
    // 倒计时
    if (R.phase === 'countdown' || R.time < 1) {
      const lw = 66 * S, lh = 22 * S, lx = W / 2 - lw / 2, ly = Y0 + 16 * S, lit = R.phase === 'countdown' ? Math.floor(R.cd) + 1 : 3;
      c.fillStyle = '#222'; roundRect(c, lx, ly, lw, lh, 5 * S); c.fill(); c.lineWidth = 2 * S; c.strokeStyle = '#000'; c.stroke();
      for (let i = 0; i < 3; i++) {
        c.fillStyle = R.phase !== 'countdown' ? '#3dff5a' : i < lit ? '#ff3a2a' : '#4a1a1a';
        c.beginPath(); c.arc(lx + lw * (i + 1) / 4, ly + lh / 2, 7 * S, 0, TAU); c.fill();
      }
      if (R.phase === 'countdown') {
        const n = 3 - Math.floor(R.cd), ph = R.cd % 1, sz = (52 + (1 - ph) * 20) * S;
        hudText(c, String(n), W / 2, Y0 + VH * 0.45, sz, '#ffe14a', 'center');
      } else hudText(c, 'GO!', W / 2, Y0 + VH * 0.45, 60 * S, '#5aff6a', 'center');
    }
    // 提示信息
    const m = v.msgs[v.msgs.length - 1];
    if (m) {
      const pop = Math.min(1, m.t * 7), a = clamp((m.dur - m.t) / 0.3, 0, 1);
      c.globalAlpha = a; hudText(c, m.text, W / 2, Y0 + VH * 0.3, (30 + (1 - pop) * 16) * S, m.col, 'center'); c.globalAlpha = 1;
    }
    if (k.wrongT > 1 && !k.finished && Math.floor(performance.now() / 300) % 2) hudText(c, '⟲ 逆行!', W / 2, Y0 + VH * 0.5, 28 * S, '#ff5a4a', 'center');
    if (k.finished && R.karts.length > 1) hudText(c, `第 ${k.place} 名`, W / 2, Y0 + VH * 0.52, 26 * S, PLACE_COL[k.place - 1] || '#fff', 'center');
  }
}

function listMenu({ title, sub, items, back, logo, footer, html }) {
  let sel = items.findIndex(i => !i.disabled); if (sel < 0) sel = 0;
  UI.show(`<div class="shade"></div><div class="panel${logo ? ' clear' : ''}">${logo || ''}${title ? `<div class="title">${title}</div>` : ''}${sub ? `<div class="sub">${sub}</div>` : ''}${html || ''}<div class="list"></div>${footer ? `<div class="hint">${footer}</div>` : ''}</div>`);

function startGP(chars, cc) {
  const racers = chars.map((ci, p) => ({ def: CHARS[ci], human: p, points: 0, lastPlace: 9 }));
  const pool = [...CHARS.filter((c, i) => !chars.includes(i)), ...AI_ONLY];
  while (racers.length < 8) racers.push({ def: pool.shift(), human: -1, points: 0, lastPlace: 9 });
  G.gp = { cc, racers, raceIdx: 0, n: chars.length };
  runGPRace();
}
function runGPRace() {
  const gp = G.gp;
  const grid = gp.raceIdx === 0
    ? [...gp.racers.filter(r => r.human < 0).sort(() => Math.random() - 0.5), ...gp.racers.filter(r => r.human >= 0)]
    : [...gp.racers].sort((a, b) => b.points - a.points || a.lastPlace - b.lastPlace);
  beginRace({ trackIdx: gp.raceIdx, mode: 'gp', cc: gp.cc, grid });
}
function startVS(chars, cc, ti) { beginRace({ trackIdx: ti, mode: 'vs', cc, grid: chars.map((ci, p) => ({ def: CHARS[ci], human: p })) }); }

function beginRace(opts) {

  UI.show(`<div class="shade"></div><div class="loading">${TRACKS[opts.trackIdx].name} 加载中…</div>`);
  MUSIC.stop(); stopEngines(G.race);
  setTimeout(() => { G.race = createRace(opts); G.scene = 'race'; G.paused = false; UI.hide(); }, 40);
}
function onRaceDone(R) {
  G.scene = 'results';
  updateEngines(R);
  MUSIC.play('menu');
  const T = R.track, order = R.order.slice();
  const est = k => k.finished ? k.finishTime : R.time + Math.max(0, (R.laps + 1) * T.L - k.dist) / (R.base * 0.85);
  const row = (cls, cells) => `<tr class="${cls}">${cells.map((x, i) => `<td${i === 0 ? ' class="pl"' : ''}>${x}</td>`).join('')}</tr>`;
  if (R.mode === 'gp') {
    const gp = G.gp;
    order.forEach((k, i) => { k.gp.points += POINTS[i] || 0; k.gp.lastPlace = i + 1; });
    const rows = order.map((k, i) => row(k.human >= 0 ? 'me' : '', [i + 1, k.name + (k.human >= 0 ? ` (${k.human + 1}P)` : ''), fmtTime(est(k)), `+${POINTS[i] || 0}`, `${k.gp.points} 分`])).join('');
    const last = gp.raceIdx >= TRACKS.length - 1;
    listMenu({
      title: `第 ${gp.raceIdx + 1} 场 · ${T.def.name} 结果`, html: `<table class="res">${rows}</table>`, items: [
        { label: last ? '查看最终排名' : '下一场', action: () => { if (last) gpFinal(); else { gp.raceIdx++; runGPRace(); } } },
        { label: '退出到标题', action: titleScreen },
      ]
    });
  } else if (R.mode === 'vs') {
    const rows = order.map((k, i) => row('me', [i + 1, `${k.human + 1}P ${k.name}`, fmtTime(est(k))])).join('');
    listMenu({
      title: `${order[0].human + 1}P 获胜！`, html: `<table class="res">${rows}</table>`, items: [
        { label: '再来一次', action: () => beginRace(G.lastOpts) },
        { label: '换赛道', action: () => pickTrack(false, ti => beginRace({ ...G.lastOpts, trackIdx: ti })) },
        { label: '退出到标题', action: titleScreen },
      ]
    });
  } else {
    const k = R.humans[0], total = k.finishTime, bestLap = Math.min(...k.lapTimes), key = 'spk_tt_' + T.def.id, rec = load(key, {});
    const newTotal = !rec.total || total < rec.total, newLap = !rec.lap || bestLap < rec.lap;
    if (newTotal) rec.total = total; if (newLap) rec.lap = bestLap; store(key, rec);
    const rows = k.lapTimes.map((t, i) => row(t === bestLap ? 'me' : '', [`第${i + 1}圈`, fmtTime(t)])).join('') + row('', ['总计', fmtTime(total)]);
    listMenu({
      title: `${T.def.name} 计时赛`, sub: (newTotal ? '🏁 新纪录：总时间！ ' : `纪录 ${fmtTime(rec.total)} `) + (newLap ? '⚡ 新纪录：最快单圈！' : `最快圈 ${fmtTime(rec.lap)}`),
      html: `<table class="res">${rows}</table>`, items: [
        { label: '再来一次', action: () => beginRace(G.lastOpts) },
        { label: '换赛道', action: () => pickTrack(true, ti => beginRace({ ...G.lastOpts, trackIdx: ti })) },
        { label: '退出到标题', action: titleScreen },
      ]
    });
  }
}
function gpFinal() {
  const gp = G.gp, st = [...gp.racers].sort((a, b) => b.points - a.points || a.lastPlace - b.lastPlace);
  const cup = ['🏆 金杯', '🥈 银杯', '🥉 铜杯'];
  const rows = st.map((r, i) => `<tr class="${r.human >= 0 ? 'me' : ''}"><td class="pl">${i + 1}</td><td>${r.def.name}${r.human >= 0 ? ` (${r.human + 1}P)` : ''}</td><td>${r.points} 分</td></tr>`).join('');
  const lines = st.map((r, i) => r.human >= 0 ? `${gp.n > 1 ? r.human + 1 + 'P ' : ''}${i < 3 ? cup[i] + '！' : `第 ${i + 1} 名，再接再厉！`}` : null).filter(Boolean).join('　');
  sfx('finish');
  listMenu({ title: `${gp.cc}cc 大奖赛 最终排名`, sub: `<span class="big">${lines}</span>`, html: `<table class="res">${rows}</table>`, items: [{ label: '返回标题', action: titleScreen }] });
}
function pauseGame() {
  if (G.scene !== 'race' || G.paused) return;
  G.paused = true; MUSIC.paused = true; updateEngines(G.race);
  const resume = () => { UI.hide(); G.paused = false; MUSIC.paused = false; };
  listMenu({ title: '暂停', back: resume, items: [{ label: '继续', action: resume }, { label: '重新开始', action: () => beginRace(G.lastOpts) }, { label: '退出到标题', action: titleScreen }] });
}
function updateEngines(R) {
  if (!SND.ctx || !R) return;
  const active = G.scene === 'race' && !G.paused && R.mode !== 'attract';
  if (active && R.engines.length === 0 && R.humans.length) R.engines = R.humans.map(() => SND.makeEngine());
  R.engines.forEach((e, i) => {
    if (!e) return;
    const k = R.humans[i], sp = Math.hypot(k.vx, k.vy);
    e.update(clamp(sp / (R.base * 1.2), 0, 1.3), active && k.drift !== 0 && k.z <= 0, k.boostT > 0, active ? (R.humans.length > 1 ? 0.6 : 1) : 0);
  });
}
function stopEngines(R) { if (R && R.engines) { R.engines.forEach(e => e && e.stop()); R.engines = []; } }

// ----------------------------------------------------------- main loop
function renderAll() {
  const R = G.race;
  if (!R) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, RW, RH); hctx.clearRect(0, 0, hud.width, hud.height); return; }
  for (const v of R.views) renderFloor(v, R);
  ctx.putImageData(frameImg, 0, 0);
  for (const v of R.views) renderSprites(v, R);
  if (R.views.length > 1) { ctx.fillStyle = '#000'; ctx.fillRect(0, 107, RW, 2); }
  if (R.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(1, R.flash)})`; ctx.fillRect(0, 0, RW, RH); }
  drawHUD(R);
}
const padPrev = {};
function pollPads() {
  getPads().forEach((p, pi) => {
    const b = i => p.buttons[i] && p.buttons[i].pressed, ax = p.axes[0] || 0, ay = p.axes[1] || 0;
    const st = { up: b(12) || ay < -0.6, down: b(13) || ay > 0.6, left: b(14) || ax < -0.6, right: b(15) || ax > 0.6, ok: b(0), back: b(1), start: b(9) };
    for (const key in st) {
      const id = pi + key;
      if (st[key] && !padPrev[id]) {
        SND.init();
        if (UI.handler) UI.key(key === 'start' ? 'ok' : key);
        else if (key === 'start' && G.scene === 'race') pauseGame();
      }
      padPrev[id] = st[key];
    }
  });
}
let lastT = 0, accT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  pollPads();
  const R = G.race;
  if (R && !G.paused) {
    accT += dt; let n = 0;
    while (accT >= STEP && n < 6) { stepRace(G.race, STEP); accT -= STEP; n++; }
    if (n >= 6) accT = 0;
    updateEngines(G.race);
  }
  renderAll();
  if (G.anim) G.anim(now / 1000);
  requestAnimationFrame(frame);
}

addEventListener('keydown', e => {
  if (PREVENT.has(e.code)) e.preventDefault();
  SND.init();
  if (e.repeat) return;
  KEYS.add(e.code);
  if (e.code === 'KeyM') { SND.toggleMute(); return; }
  if (UI.handler) { const a = MENU_MAP[e.code]; if (a) UI.key(a); return; }
  if (G.scene === 'race' && (e.code === 'Escape' || e.code === 'KeyP')) pauseGame();
});
addEventListener('keyup', e => KEYS.delete(e.code));
addEventListener('blur', () => KEYS.clear());
addEventListener('pointerdown', () => SND.init());
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { pauseGame(); if (SND.ctx) SND.ctx.suspend(); }
  else if (SND.ctx) SND.ctx.resume();
});
function resize() {
  const ww = innerWidth, wh = innerHeight; let w = ww, h = ww * 9 / 16;
  if (h > wh) { h = wh; w = wh * 16 / 9; }
  wrap.style.width = w + 'px'; wrap.style.height = h + 'px'; wrap.style.fontSize = (h / 26) + 'px';
  const dpr = Math.min(2, devicePixelRatio || 1);
  hud.width = Math.round(w * dpr); hud.height = Math.round(h * dpr);
}
addEventListener('resize', resize);
function boot() {
  resize();
  UI.show('<div class="loading">加载中…</div>');
  setTimeout(() => {
    buildSprites();
    for (const d of [...CHARS, ...AI_ONLY]) d.frames = renderVoxelFrames(buildVoxels(d));
    titleScreen();
    requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); });
  }, 20);
}
boot();
</script>
</body>
